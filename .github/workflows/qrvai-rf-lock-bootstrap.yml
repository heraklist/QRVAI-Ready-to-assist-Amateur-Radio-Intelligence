name: One-time RF MCP dependency lock (NO deployment)
on:
  push:
    branches: [feat/qrvai-rf-mcp-native-tdd]
    paths: ['mcp/qrvai-rf-worker/package.json']
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'heraklist/QRVAI-Ready-to-assist-Amateur-Radio-Intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pin exact resolved npm integrity hashes (no scripts, no deploy)
        run: |
          cd mcp/qrvai-rf-worker
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/qrvai-rf-worker/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(rf-mcp): pin SDK v2 Zod 4.2 compatible lock"
            git push origin HEAD:feat/qrvai-rf-mcp-native-tdd
          fi
