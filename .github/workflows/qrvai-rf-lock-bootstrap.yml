name: One-time RF MCP lockfile generation (NO deployment)
on:
  push:
    branches:
      - feat/qrvai-rf-mcp-native-tdd
    paths:
      - 'mcp/qrvai-rf-worker/package.json'
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'heraklist/QRVAI-Ready-to-assist-Amateur-Radio-Intelligence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and commit exact npm dependency lock, no dependency scripts
        run: |
          cd mcp/qrvai-rf-worker
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/qrvai-rf-worker/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(rf-mcp): pin resolved dependency integrity lockfile"
            git push origin HEAD:feat/qrvai-rf-mcp-native-tdd
          fi
