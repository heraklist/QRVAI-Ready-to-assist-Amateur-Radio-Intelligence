name: QRVAI RF MCP Native TDD
on:
  pull_request:
    paths:
      - 'mcp/qrvai-rf-worker/**'
      - '.github/workflows/qrvai-rf-mcp-ci.yml'
      - 'qa/mcp/**'
      - 'docs/runbooks/qrvai-rf-mcp-*.md'
  push:
    branches:
      - main
      - feat/qrvai-rf-mcp-native-tdd
jobs:
  rf-native-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified ref
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 verified ref
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/qrvai-rf-worker/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified ref
        with:
          python-version: '3.11'
      - name: Verify existing V0 suite
        run: |
          python -m pip install -r requirements-v0-dev.txt
          python -m unittest discover -s tests/v0 -p 'test_*.py' -v
      - name: Verify authenticated Vercel MCP adapter and RF tools with no deployment
        working-directory: mcp/qrvai-rf-worker
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
