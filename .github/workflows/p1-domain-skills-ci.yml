name: QRVAI P1 Domain Skills CI
on:
  pull_request:
    paths:
      - 'staging/p1-domain-skills/**'
      - 'scripts/p1/**'
      - 'tests/p1/**'
      - 'qa/p1/**'
      - 'docs/architecture/skill-and-subskill-registry-v0.5.md'
      - 'docs/architecture/capability-register-v0.5.md'
      - '.github/workflows/p1-domain-skills-ci.yml'
jobs:
  p1-v0-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-v0-dev.txt
      - name: P1 unit tests
        run: python -m unittest discover -s tests/p1 -p 'test_*.py' -v
      - name: P1 canonical identities, staged owners and bilingual fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.p1.registry import load_registry
          from scripts.p1.audit_domain_skills import audit_stage
          from scripts.p1.routing_cases import validate_routing_cases
          root=Path(".")
          specs=load_registry(root/"docs/architecture/skill-and-subskill-registry-v0.5.md",
                              root/"docs/architecture/capability-register-v0.5.md")
          assert len(specs)==24
          assert sum(len(x.procedures) for x in specs)==72
          stage=root/"staging/p1-domain-skills"
          assert audit_stage(stage,specs,frozenset({"B07","B08","A01","A02","A03","A04","A05","B06","B09","B10","B12"}))==[]
          assert validate_routing_cases(root/"qa/p1/domain-routing-cases.json",specs)==[]
          print("P1_REGISTRY=24/72")
          print("P1_STAGE=11/24,33/72")
          print("P1_HOST_E2E=NOT_EXECUTED")
          PY
      - name: Explicit Family A fixture and legal-authority honesty gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          corpus=json.loads(Path("qa/p1/family-a-routing-and-safety-cases.json").read_text(encoding="utf8"))
          authorities=json.loads(Path("qa/p1/family-a-source-evidence-candidates.json").read_text(encoding="utf8"))
          expected={f"SS-A{n:02d}-{k}" for n in range(1,6) for k in (1,2,3)}
          actual={row["procedure_id"] for row in corpus}
          assert len(corpus)==30 and actual==expected
          assert len({r["id"] for r in corpus})==30
          assert len(authorities)==7
          assert all(r["legal_review_state"]=="UNREVIEWED" and r["permission_assertion"] is False
                     and r["effective_from"] is None for r in authorities)
          assert not any(row["domain"] in ("A03","A04") and
                         row["source_kind"] in ("UNREVIEWED_SOURCE","USER_SUPPLIED_UNVERIFIED") and
                         row["expected_outcome"] in ("SYNTHETIC_ALLOWED","SYNTHETIC_NOT_ALLOWED") for row in corpus)
          print("P1_FAMILY_A_CASES=30")
          print("P1_FAMILY_A_SS_COVERED=15/15")
          print("P1_AUTHORITY_CANDIDATES=7")
          print("P1_LEGAL_PRIMARY_RULES_EXPERT_VALIDATED=0/UNVERIFIED")
          PY
      - name: Verify deterministic approved P1 source-only review archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile
          from scripts.p1.registry import load_registry
          from scripts.p1.audit_domain_skills import audit_stage
          from scripts.p1.build_staging_archive import build_review_zip, validate_review_zip
          specs = load_registry(Path("docs/architecture/skill-and-subskill-registry-v0.5.md"),
                                Path("docs/architecture/capability-register-v0.5.md"))
          stage = Path("staging/p1-domain-skills")
          owners = frozenset({"B07","B08","A01","A02","A03","A04","A05","B06","B09","B10","B12"})
          assert audit_stage(stage,specs,owners)==[]
          expected = frozenset(
              "p1-domain-skills/" + relative
              for d in specs if d.id in owners
              for relative in (f"skills/{d.slug}/SKILL.md",*(p.relative_path for p in d.procedures))
          )
          assert len(expected)==44
          with TemporaryDirectory() as temporary:
              target = Path(temporary)
              one = build_review_zip(stage,target/"review-1.zip",specs,owners)
              two = build_review_zip(stage,target/"review-2.zip",specs,owners)
              a, b = sha256(one.read_bytes()).hexdigest(), sha256(two.read_bytes()).hexdigest()
              assert a==b,"review ZIP must be byte-identical"
              assert validate_review_zip(one,expected)==[]
              with ZipFile(one) as z:
                  assert len(z.namelist())==44
              print("P1_STAGE_ARCHIVE_FILES=44")
              print("P1_STAGE_ARCHIVE_SHA256="+a)
          PY
      - name: Preserve V0 regression suite
        run: python -m unittest discover -s tests/v0 -p 'test_*.py' -v
      - name: Preserve V0 strict archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from hashlib import sha256
          from scripts.v0.audit_content import audit_catalog
          from scripts.v0.build_archive import build_archive, validate_archive
          root = Path("qrvai")
          result = audit_catalog(root)
          assert result["violations"] == [], result["violations"]
          assert len(result["skill_names"]) == 5
          with TemporaryDirectory() as tmp:
              archive = build_archive(root, Path(tmp)/"v0.zip")
              assert validate_archive(archive) == []
              import zipfile
              with zipfile.ZipFile(archive) as zip_file:
                  assert len(zip_file.namelist()) == 12
              print("V0_ARCHIVE_FILES=12")
              fingerprint = sha256(archive.read_bytes()).hexdigest()
              assert fingerprint == "eb2fb505e1e2ad24b4b5a0aea07137a7e56a8b4888c33017055cb103aba6fe7f", "V0 archive changed"
              print("V0_ARCHIVE_SHA256=" + fingerprint)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/qrvai-rf-worker/package-lock.json
      - name: Preserve existing RF MCP Native TDD typecheck and unit suite
        working-directory: mcp/qrvai-rf-worker
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
