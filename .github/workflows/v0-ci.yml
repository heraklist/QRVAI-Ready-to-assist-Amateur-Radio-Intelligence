name: QRVAI V0 Tests
on:
  push:
    branches:
      - main
      - feat/qrvai-v0-native-reviewed
  pull_request:
    paths:
      - 'qrvai/**'
      - 'docs/**'
      - 'tests/v0/**'
      - 'qa/v0/**'
      - 'scripts/v0/**'
      - 'requirements-v0-dev.txt'
      - '.github/workflows/v0-ci.yml'
jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified official tag
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 verified official tag
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-v0-dev.txt
      - run: python -m unittest discover -s tests/v0 -p 'test_*.py' -v
      - name: Audit Skills and build clean draft archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from scripts.v0.audit_content import audit_catalog, validate_qa_cases
          from scripts.v0.build_archive import build_archive, validate_archive
          issues = audit_catalog(Path("qrvai"))["violations"]
          if issues:
              raise SystemExit("catalog invalid: " + "; ".join(issues))
          qa_errors = validate_qa_cases(Path("qa/v0/prompt-cases.json"))
          if qa_errors:
              raise SystemExit("QA corpus invalid: " + "; ".join(qa_errors))
          print("CLEAN_V0_QA_CORPUS=PASS")
          zip_path = build_archive(Path("qrvai"), Path("dist/qrvai-v0-0.1.0.zip"))
          assert validate_archive(zip_path) == []
          print("CLEAN_V0_ARCHIVE_SHA256=" + sha256(zip_path.read_bytes()).hexdigest())
          print("CLEAN_V0_ARCHIVE_FILES=12")
          PY
      - name: Preserve review-only V0 archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 verified official tag
        with:
          name: qrvai-v0-clean-draft-not-installed
          path: dist/qrvai-v0-0.1.0.zip
          if-no-files-found: error
          retention-days: 7
